<!-- @dsCard group="Components" viewport="700x430" name="Core — Button · Badge · Chip · Field" subtitle="Theme-aware primitives (shown on Premium)" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-arabic); background: var(--bg); color: var(--ink); }
  .wrap { padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; }
  .group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .lbl { font-size: 11px; font-weight: 800; letter-spacing: .4px; color: var(--ink-faint); text-transform: uppercase; width: 100%; margin-bottom: -4px; direction: ltr; text-align: right; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style>
</head>
<body class="theme-premium">
  <div id="root" class="wrap"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, Badge, Chip, Field } = window.AlNujomDesignSystem_6d1292;
    function Demo() {
      const [sel, setSel] = React.useState('apartments');
      return (
        <>
          <div className="group"><span className="lbl">Buttons</span>
            <Button variant="primary" icon="phone">اتصال</Button>
            <Button variant="whatsapp" icon="message-circle">واتساب</Button>
            <Button variant="outline">إنشاء حساب</Button>
            <Button variant="ghost" iconEnd="chevron-left">عرض الكل</Button>
            <Button variant="primary" size="sm">تطبيق</Button>
          </div>
          <div className="group"><span className="lbl">Badges</span>
            <Badge variant="featured" icon="star">مميّز</Badge>
            <Badge variant="verified" icon="badge-check">موثّق</Badge>
            <Badge variant="sale">للبيع</Badge>
            <Badge variant="rent">للإيجار</Badge>
            <Badge variant="neutral">جديد</Badge>
          </div>
          <div className="group"><span className="lbl">Chips</span>
            <Chip icon="building-2" selected={sel==='apartments'} onClick={()=>setSel('apartments')}>شقق</Chip>
            <Chip icon="home" selected={sel==='houses'} onClick={()=>setSel('houses')}>منازل</Chip>
            <Chip icon="store" selected={sel==='shops'} onClick={()=>setSel('shops')}>محلات</Chip>
            <Chip removable onRemove={()=>{}}>دمشق</Chip>
          </div>
          <div className="group"><span className="lbl">Fields</span>
            <div className="fields" style={{width:'100%'}}>
              <Field label="عنوان الإعلان" placeholder="شقة مشطّبة قرب الحديقة" />
              <Field label="نوع العقار" as="select" options={['شقة','منزل','محل','مكتب']} />
              <Field label="السعر" unit="ل.س" defaultValue="85,000,000" />
              <Field label="المساحة" unit="م²" defaultValue="180" />
            </div>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
    requestAnimationFrame(() => window.lucide && window.lucide.createIcons());
  </script>
</body>
</html>
