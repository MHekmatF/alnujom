<!-- @dsCard group="Components" viewport="700x420" name="PropertyCard — vertical & horizontal" subtitle="The marketplace listing card" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-arabic); background: var(--bg); }
  .wrap { padding: 22px 24px; display: grid; grid-template-columns: 250px 1fr; gap: 18px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 14px; }
</style>
</head>
<body class="theme-premium">
  <div id="root" class="wrap"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { PropertyCard } = window.AlNujomDesignSystem_6d1292;
    const A = "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=600&q=80";
    const B = "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=600&q=80";
    function Demo() {
      const [fav, setFav] = React.useState(true);
      return (
        <>
          <PropertyCard title="شقة فاخرة في المزة" price="85,000,000" altPrice="≈ $32,000"
            location="دمشق — المزة" image={A} featured purpose="sale"
            specs={{beds:3,baths:2,area:180}} favorite={fav} onFavorite={()=>setFav(!fav)} />
          <div className="col">
            <PropertyCard layout="horizontal" title="فيلا مع حديقة في الفرقان" price="120,000,000"
              location="حلب — الفرقان" image={B} purpose="sale" specs={{beds:4,baths:3,area:240}} />
            <PropertyCard layout="horizontal" title="محل تجاري على الشارع العام" price="450,000"
              currency="$/شهر" location="حمص — الإنشاءات" purpose="rent" specs={{area:65}} />
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
    requestAnimationFrame(() => window.lucide && window.lucide.createIcons());
  </script>
</body>
</html>
