<!-- @dsCard group="Components" viewport="700x320" name="BottomNav — across directions" subtitle="The 5-tab spine, retoned per theme" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-arabic); background: #E7E2D8; }
  .wrap { padding: 26px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .demo { border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md); background: var(--bg); }
  .demo .pad { height: 44px; }
  .cap { font-size: 11px; font-weight: 800; color: #8A8170; padding: 0 0 8px; direction: ltr; text-align: right; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { BottomNav } = window.AlNujomDesignSystem_6d1292;
    function Cell({theme, active, cap}) {
      return (
        <div>
          <div className="cap">{cap}</div>
          <div className={"demo " + theme}>
            <div className="pad" />
            <BottomNav active={active} />
          </div>
        </div>
      );
    }
    function Demo() {
      return (
        <div className="wrap">
          <Cell theme="theme-premium" active="home" cap=".theme-premium · gold" />
          <Cell theme="theme-airy" active="favorites" cap=".theme-airy · teal" />
          <Cell theme="theme-dark" active="search" cap=".theme-dark · blue glow" />
          <Cell theme="theme-bold" active="add" cap=".theme-bold · orange FAB" />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
    requestAnimationFrame(() => window.lucide && window.lucide.createIcons());
  </script>
</body>
</html>
