<!-- @dsCard group="Colors" viewport="700x176" name="Brand constants" subtitle="Theme-independent identity & trust colors" -->
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-ui); background: #fff; color: #111; }
  .wrap { padding: 22px 24px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .name { font-size: 12.5px; font-weight: 700; margin-top: 9px; color: #1A1714; }
  .hex { font-size: 11px; color: #8A8A8A; font-family: ui-monospace, monospace; margin-top: 2px; letter-spacing: .2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--brand-stars-blue)"></div><div class="name">Stars Blue</div><div class="hex">#13507D</div></div>
      <div class="sw"><div class="chip" style="background:var(--brand-coral)"></div><div class="name">Coral</div><div class="hex">#F4795B</div></div>
      <div class="sw"><div class="chip" style="background:var(--brand-gold)"></div><div class="name">Gold</div><div class="hex">#C2A14D</div></div>
      <div class="sw"><div class="chip" style="background:var(--brand-verified)"></div><div class="name">Verified</div><div class="hex">#1F7A4D</div></div>
      <div class="sw"><div class="chip" style="background:var(--brand-whatsapp)"></div><div class="name">WhatsApp</div><div class="hex">#1DAB61</div></div>
    </div>
  </div>
</body>
</html>
