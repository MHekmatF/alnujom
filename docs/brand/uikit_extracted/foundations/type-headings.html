<!-- @dsCard group="Type" viewport="700x300" name="Tajawal headings" subtitle="Arabic display → title scale" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-arabic); background: #fff; color: var(--ink); }
  .wrap { padding: 20px 26px; }
  .line { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; padding: 7px 0; border-bottom: 1px solid #F0ECE3; }
  .line:last-child { border-bottom: 0; }
  .spec { font-family: ui-monospace, monospace; font-size: 10.5px; color: #A89E92; direction: ltr; white-space: nowrap; }
  .dl { font-size: 34px; font-weight: 800; }
  .hl { font-size: 26px; font-weight: 700; }
  .hm { font-size: 22px; font-weight: 700; }
  .tl { font-size: 19px; font-weight: 700; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="line"><span class="dl">النجوم للعقارات</span><span class="spec">display · 34/800</span></div>
    <div class="line"><span class="hl">إضافة إعلان جديد</span><span class="spec">headline-lg · 26/700</span></div>
    <div class="line"><span class="hm">عقارات مميّزة</span><span class="spec">headline-md · 22/700</span></div>
    <div class="line"><span class="tl">شقة فاخرة في المزة</span><span class="spec">title-lg · 19/700</span></div>
  </div>
</body>
</html>
