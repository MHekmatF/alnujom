<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-arabic); background: #fff; color: var(--ink); }
  .wrap { padding: 20px 26px; }
  .line { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; padding: 7px 0; border-bottom: 1px solid #F0ECE3; }
  .line:last-child { border-bottom: 0; }
  .spec { font-family: ui-monospace, monospace; font-size: 10.5px; color: #A89E92; direction: ltr; white-space: nowrap; }
  .bl { font-size: 16px; font-weight: 400; }
  .bm { font-size: 14px; font-weight: 400; color: #5F6C78; }
  .ll { font-size: 14px; font-weight: 700; }
  .lm { font-size: 12px; font-weight: 700; color: #5F6C78; letter-spacing: .3px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="line"><span class="bl">انشر إعلانك خلال دقائق ووصلك للزبائن.</span><span class="spec">body-lg · 16/400</span></div>
    <div class="line"><span class="bm">دمشق — المزة · نُشر قبل ٣ أيام</span><span class="spec">body-md · 14/400</span></div>
    <div class="line"><span class="ll">تسجيل الدخول</span><span class="spec">label-lg · 14/700</span></div>
    <div class="line"><span class="lm">موثّق · مميّز · للبيع</span><span class="spec">label-md · 12/700</span></div>
  </div>
</body>
</html>
