<!-- @dsCard group="Colors" viewport="700x200" name="Airy theme" subtitle=".theme-airy — white · slate · teal" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-ui); }
  .wrap { padding: 20px 24px; background: var(--bg); }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .chip { height: 58px; border-radius: var(--radius-md); border: 1px solid var(--border); }
  .name { font-size: 12px; font-weight: 700; margin-top: 8px; color: var(--ink); }
  .hex { font-size: 10.5px; color: var(--ink-muted); font-family: ui-monospace, monospace; margin-top: 2px; direction: ltr; }
  .demo { margin-top: 14px; display: flex; align-items: center; gap: 12px; }
  .btn { background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px; padding: 10px 20px; border-radius: var(--radius-pill); box-shadow: var(--shadow-md); }
  h4 { margin: 0; font-size: 19px; color: var(--ink); font-weight: 800; }
</style>
</head>
<body class="theme-airy">
  <div class="wrap">
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--bg)"></div><div class="name">bg</div><div class="hex">#F5F7FA</div></div>
      <div class="sw"><div class="chip" style="background:var(--card)"></div><div class="name">card</div><div class="hex">#FFFFFF</div></div>
      <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="name">ink</div><div class="hex">#0F172A</div></div>
      <div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="name">accent</div><div class="hex">#0EA5A4</div></div>
      <div class="sw"><div class="chip" style="background:var(--accent-soft)"></div><div class="name">soft</div><div class="hex">#DAF3F2</div></div>
    </div>
    <div class="demo">
      <h4>تواصل عبر واتساب</h4>
      <span class="btn">إرسال</span>
    </div>
  </div>
</body>
</html>
