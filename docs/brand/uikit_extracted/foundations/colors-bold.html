<!-- @dsCard group="Colors" viewport="700x200" name="Bold theme" subtitle=".theme-bold — navy · hot-orange gradient" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-ui); }
  .wrap { padding: 20px 24px; background: var(--bg); }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .chip { height: 58px; border-radius: var(--radius-md); border: 1px solid var(--border); }
  .name { font-size: 12px; font-weight: 700; margin-top: 8px; color: var(--ink); }
  .hex { font-size: 10.5px; color: var(--ink-muted); font-family: ui-monospace, monospace; margin-top: 2px; direction: ltr; }
  .demo { margin-top: 14px; display: flex; align-items: center; gap: 12px; }
  .btn { background: var(--accent-grad); color: var(--accent-ink); font-weight: 800; font-size: 13px; padding: 10px 22px; border-radius: var(--radius-md); box-shadow: var(--glow); }
  h4 { margin: 0; font-size: 19px; color: var(--ink); font-weight: 800; }
</style>
</head>
<body class="theme-bold">
  <div class="wrap">
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--bg)"></div><div class="name">navy</div><div class="hex">#0A1A3F</div></div>
      <div class="sw"><div class="chip" style="background:var(--input-bg)"></div><div class="name">input</div><div class="hex">#10245A</div></div>
      <div class="sw"><div class="chip" style="background:var(--input-border)"></div><div class="name">border</div><div class="hex">#1F3A78</div></div>
      <div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="name">accent</div><div class="hex">#FF6B35</div></div>
      <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="name">ink</div><div class="hex">#F2F6FF</div></div>
    </div>
    <div class="demo">
      <h4>إضافة إعلان</h4>
      <span class="btn">متابعة</span>
    </div>
  </div>
</body>
</html>
