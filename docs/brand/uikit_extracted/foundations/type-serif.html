<!-- @dsCard group="Type" viewport="700x230" name="Serif display — Playfair" subtitle="Premium-direction editorial headings" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--bg); }
  .wrap { padding: 22px 26px; }
  .serif { font-family: var(--font-serif); color: var(--ink); margin: 0; line-height: 1.05; }
  .big { font-size: 40px; font-weight: 800; }
  .med { font-size: 26px; font-weight: 600; font-style: italic; color: var(--accent); margin-top: 8px; }
  .meta { font-family: var(--font-ui); font-size: 11.5px; color: var(--ink-muted); margin-top: 14px; direction: ltr; letter-spacing: .3px; }
</style>
</head>
<body class="theme-premium">
  <div class="wrap">
    <p class="serif big">Al Nujoom</p>
    <p class="serif med">Featured Residences</p>
    <p class="meta">Playfair Display · 800 / 600 italic · Latin editorial accent only</p>
  </div>
</body>
</html>
