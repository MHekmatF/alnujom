<!-- @dsCard group="Type" viewport="700x170" name="Price treatment" subtitle="Bold amount leads; currency suffix supports" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-arabic); background: var(--bg); }
  .wrap { padding: 22px 26px; display: flex; gap: 46px; align-items: flex-end; }
  .price { display: flex; align-items: baseline; gap: 6px; color: var(--accent); }
  .amt { font-weight: 800; }
  .cur { font-weight: 700; opacity: .8; }
  .lg .amt { font-size: 30px; } .lg .cur { font-size: 16px; }
  .md .amt { font-size: 20px; } .md .cur { font-size: 13px; }
  .alt { font-size: 13px; color: var(--ink-muted); font-weight: 500; margin-top: 4px; direction: ltr; text-align: right; }
  .lbl { font-family: ui-monospace, monospace; font-size: 10.5px; color: var(--ink-faint); margin-top: 10px; direction: ltr; }
</style>
</head>
<body class="theme-premium">
  <div class="wrap">
    <div>
      <div class="price lg"><span class="amt">85,000,000</span><span class="cur">ل.س</span></div>
      <div class="alt">≈ $32,000</div>
      <div class="lbl">price-lg · 24–30 / 800</div>
    </div>
    <div>
      <div class="price md"><span class="amt">120,000,000</span><span class="cur">ل.س</span></div>
      <div class="lbl">price-md · 17–20 / 800</div>
    </div>
  </div>
</body>
</html>
