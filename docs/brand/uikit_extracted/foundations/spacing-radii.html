<!-- @dsCard group="Spacing" viewport="700x180" name="Radii scale" subtitle="sm 8 · md 12 · lg 16 · xl 24 · pill" -->
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-ui); background: #fff; color: #1A1714; }
  .wrap { padding: 22px 26px; display: flex; gap: 20px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .box { width: 78px; height: 56px; background: var(--brand-stars-blue); }
  .lab { font-size: 11.5px; font-weight: 700; }
  .px { font-size: 10px; color: #A89E92; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lab">sm</div><div class="px">8</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lab">md · cards</div><div class="px">12</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lab">lg</div><div class="px">16</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lab">xl · sheets</div><div class="px">24</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-pill);width:56px"></div><div class="lab">pill</div><div class="px">999</div></div>
  </div>
</body>
</html>
