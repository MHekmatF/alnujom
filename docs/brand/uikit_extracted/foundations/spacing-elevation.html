<!-- @dsCard group="Spacing" viewport="700x190" name="Elevation & glow" subtitle="Soft shadows (light) · accent glow (dark)" -->
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-ui); }
  .wrap { padding: 26px; display: flex; gap: 22px; background: #F1ECE3; }
  .card { flex: 1; height: 78px; background: #fff; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #1A1714; }
  .s1 { box-shadow: var(--shadow-sm); }
  .s2 { box-shadow: var(--shadow-md); }
  .s3 { box-shadow: var(--shadow-lg); }
  .glow { background: #161C2D; color: #EAF0FB; box-shadow: 0 0 0 1px rgba(59,130,246,.45), 0 6px 22px rgba(59,130,246,.30); }
</style>
</head>
<body class="theme-premium">
  <div class="wrap">
    <div class="card s1">shadow-sm</div>
    <div class="card s2">shadow-md</div>
    <div class="card s3">shadow-lg</div>
    <div class="card glow">glow</div>
  </div>
</body>
</html>
