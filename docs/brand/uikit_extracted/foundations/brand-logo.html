<!-- @dsCard group="Brand" viewport="700x260" name="Logo & mark" subtitle="النجوم — the star-ringed N" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-arabic); }
  .wrap { display: flex; height: 260px; }
  .panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .light { background: var(--bg); }
  .dark { background: #0B1020; }
  img { height: 132px; width: auto; object-fit: contain; }
  .mark { height: 96px; }
  .cap { font-size: 11.5px; color: var(--ink-muted); letter-spacing: .2px; }
  .cap.on-dark { color: #97A3BC; }
</style>
</head>
<body class="theme-premium">
  <div class="wrap">
    <div class="panel light">
      <img src="../assets/brand/logo-full.png" alt="شعار النجوم">
      <div class="cap">الشعار الكامل · على خلفية فاتحة</div>
    </div>
    <div class="panel dark">
      <img class="mark" src="../assets/brand/logo-mark.png" alt="علامة النجوم">
      <div class="cap on-dark">العلامة فقط · حلقة النجوم</div>
    </div>
  </div>
</body>
</html>
