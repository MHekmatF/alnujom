<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px grid — xs 4 → xxxl 48" -->
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-ui); background: #fff; color: #1A1714; }
  .wrap { padding: 24px 26px; display: flex; gap: 20px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--brand-stars-blue); border-radius: 3px; width: 22px; }
  .lab { font-size: 11px; font-weight: 700; }
  .px { font-size: 10px; color: #A89E92; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="bar" style="height:var(--space-xs)"></div><div class="lab">xs</div><div class="px">4</div></div>
    <div class="col"><div class="bar" style="height:var(--space-sm)"></div><div class="lab">sm</div><div class="px">8</div></div>
    <div class="col"><div class="bar" style="height:var(--space-md)"></div><div class="lab">md</div><div class="px">12</div></div>
    <div class="col"><div class="bar" style="height:var(--space-lg)"></div><div class="lab">lg</div><div class="px">16</div></div>
    <div class="col"><div class="bar" style="height:var(--space-xl)"></div><div class="lab">xl</div><div class="px">24</div></div>
    <div class="col"><div class="bar" style="height:var(--space-xxl)"></div><div class="lab">xxl</div><div class="px">32</div></div>
    <div class="col"><div class="bar" style="height:var(--space-xxxl)"></div><div class="lab">xxxl</div><div class="px">48</div></div>
  </div>
</body>
</html>
