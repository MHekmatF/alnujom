include: package:flutter_lints/flutter.yaml

l10n_lint_exempt:
  # Last-resort ErrorWidget: localisations may be exactly what failed, so it
  # carries its own Arabic copy. See the doc comment on AppErrorView.
  - lib/core/widgets/app_error_view.dart
  - lib/l10n/**.arb
  - lib/l10n/app_localizations*.dart
  - lib/debug/**
  - test/goldens/**
  - lib/features/locations/presentation/pages/location_picker_smoke_test_page.dart
  - lib/features/currencies/presentation/pages/money_formatter_showcase_page.dart
  # Admin widget — dynamic data interpolations (gov/city/publisher name); not translatable copy.
  - lib/features/admin/listing_review/presentation/widgets/pending_queue_card.dart
  # Numeric ordering badge ('$ordering') — pure data, not translatable copy.
  - lib/features/listing_form/presentation/widgets/media_thumbnail.dart
  # Timestamp + admin-team label composite ('${timestamp} • ${label}') — dynamic data.
  - lib/features/publisher_dashboard/presentation/pages/listing_moderation_history_page.dart
  # Currency code+symbol display ('${c.code} ${c.symbol}') — pure data, not translatable copy.
  - lib/features/search/presentation/widgets/search_filter_sheet.dart

analyzer:
  errors:
    avoid_print: error
    prefer_const_constructors: error

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    unawaited_futures: true
