  supabase_flutter: 2.12.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: 10.0.0
  build_runner: 2.7.1
  flutter_lints: 5.0.0
