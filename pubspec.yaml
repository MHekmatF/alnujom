name: alnujom
description: AlNujom Android app foundation.
publish_to: 'none'
version: 1.1.2+4

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: 3.4.1
  # Phase polish — confetti burst for the listing-publish success celebration.
  confetti: ^0.8.0
  # Phase polish — fully custom pull-to-refresh (branded star indicator) over
  # any scrollable, without restructuring each feed's scroll view.
  custom_refresh_indicator: ^4.0.1
  decimal: ^3.0.0
  equatable: 2.0.8
  flutter_bloc: 9.1.1
  # Phase polish — declarative motion (entrances, shimmer, micro-interactions).
  # Pure-Dart, no platform channels; takes Duration/Curve so AppMotion stays the
  # source of truth. Reduce-motion is guarded by the app (it ignores the flag).
  flutter_animate: ^4.5.0
  flutter_lucide: 1.11.0
  flutter_secure_storage: 10.0.0
  get_it: 8.2.0
  # Phase polish — richer empty-state illustration. The animation asset
  # (assets/lottie/empty_stars.json) is authored in-repo (ours, no third-party
  # licence); recoloured to the active theme at runtime.
  lottie: ^3.1.2
  go_router: 17.2.2
  injectable: 2.5.1
  intl: 0.20.2
  supabase_flutter: 2.12.4
  image_picker: ^1.2.2
  image: ^4.8.0
  flutter_image_compress: ^2.4.0
  url_launcher: ^6.3.0
  # Phase 28 — nearby-amenities lookup (OpenStreetMap Overpass API; was already
  # transitive via supabase_flutter, promoted to a direct dep for the import).
  http: ^1.2.0
  # Phase 25 uplift v2 — native share sheet for the listing-detail Share action.
  share_plus: ^10.1.4
  # Phase 22 — push notifications (Android-only; app builds with push DISABLED
  # when google-services.json is absent — R-184/R-195/SC-003).
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.4.0
  geolocator: ^13.0.0
  permission_handler: ^11.3.0
  # Phase 24 (CR) — crash & error reporting via a self-hosted/EU Sentry instance
  # (R-206). Behind the core/ CrashReporter seam; DSN supplied via dart-define;
  # NoopCrashReporter is bound when the DSN is empty (no init, no send).
  sentry_flutter: 8.14.2
  # Phase 24 UP — in-app update prompt (Android-only; R-210).
  package_info_plus: 9.0.1
  panorama_viewer: ^2.0.7
  # Phase 29 — F4 Reels: official Flutter in-app video playback (ExoPlayer on
  # Android). One controller active at a time; strict 3-controller window.
  video_player: ^2.9.2
  # Phase 29 — F1 CRM follow-up reminders: device-local scheduled notifications.
  # There is NO server scheduler (pg_cron is not installed), so reminders are
  # scheduled on-device with zonedSchedule in INEXACT mode (no exact-alarm
  # permission). The in-app "due today" list is the permission-denied fallback.
  flutter_local_notifications: ^19.0.0
  # Phase 29 — required by flutter_local_notifications zonedSchedule (tz db +
  # device IANA zone; DateTime.timeZoneName returns unusable abbreviations).
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  # Phase 30 — F1 client-side video compression (720p) + poster thumbnails so
  # listing videos don't fill Storage (they upload RAW today). Best-effort:
  # always falls back to the original on failure.
  video_compress: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  analyzer: ">=7.7.0 <9.0.0"
  bloc_test: ^10.0.0
  build_runner: ^2.7.1
  flutter_lints: 5.0.0
  injectable_generator: ^2.8.1
  mockito: ^5.5.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.7

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/watermark/
    # Only the three files the app loads at runtime live here — the logo, the
    # brand mark and the in-app splash. The launcher-icon and native-splash
    # source art lives in `branding/` at the repo root instead: a declared
    # asset directory ships **every** file in it, and those ten were 2.9 MB of
    # build-time-only artwork riding along inside every APK.
    - assets/branding/
    - assets/onboarding/
    - assets/lottie/
  fonts:
    # Phase 033 — Tajawal: the design-system Arabic typeface (UI + body + headings).
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    # PERF-L1 — Cairo + IBMPlexSansArabic were bundled (~1.5 MB) but referenced
    # nowhere (the design system uses only Tajawal + Inter, see typography.dart).
    # Unbundled to shrink the APK; the .ttf files remain in assets/fonts/ if ever
    # needed again.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Phase 24 RB — flutter_launcher_icons config (R-212)
# Generates mipmap-* + adaptive icon into android/app/src/main/res/**
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  # Phase 033 — the "orbit" emblem (silver skyline + stars + orbit ring) on the
  # brand navy. Legacy icon = the emblem-on-navy square; the adaptive icon
  # composes the transparent emblem foreground over the same navy.
  #
  # Both are DERIVED from branding/app_icon_orbit.png by
  # tool/build_orbit_icon_assets.py — do not point these at the raw artwork.
  # It is a crop of a taller lockup, so it carries a sliced-off wordmark along
  # its bottom edge, and the foreground cut from it in 1.1.0 kept a hard-edged
  # slab of pale sky that every launcher drew as a rectangle behind the emblem.
  # Regenerate with the script, then `dart run flutter_launcher_icons`.
  image_path: "branding/app_icon_orbit_square.png"
  adaptive_icon_background: "#0B182B"
  adaptive_icon_foreground: "branding/icon_fg_orbit.png"
  min_sdk_android: 24

# Phase 24 RB — flutter_native_splash config (R-212; light + dark)
# Phase 25 — repalette to the Claude Design brand (deep blue + dark navy).
# Generates splash drawables + values/values-night
flutter_native_splash:
  # Phase 033 — brand navy (#0B182B), light and dark identical.
  #
  # Android 12+ shows `splash_icon_orbit.png` centred on the navy. **Pre-Android
  # -12 shows the navy alone** — checked on the Infinix (Android 10) on
  # 2026-09-04: the generated `drawable/background.png` is a 1x1 solid colour,
  # so `background_image` never reaches that path however it is set. That is
  # left as it is rather than forced, because the app draws its own splash the
  # moment Flutter starts and a flat navy hand-off is quieter than a second
  # piece of artwork appearing for a fraction of a second. `background_image`
  # stays declared so the intent is not lost.
  color: "#0B182B"
  background_image: branding/splash_orbit.png
  color_dark: "#0B182B"
  background_image_dark: branding/splash_orbit.png
  android: true
  ios: false
  android_12:
    color: "#0B182B"
    image: branding/splash_icon_orbit.png
    color_dark: "#0B182B"
    image_dark: branding/splash_icon_orbit.png
