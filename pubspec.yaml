name: alnujom
description: AlNujom Android app foundation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: 3.4.1
  equatable: 2.0.8
  flutter_bloc: 9.1.1
  flutter_secure_storage: 10.0.0
  get_it: 8.2.0
