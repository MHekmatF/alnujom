name: alnujom
description: AlNujom Android app foundation.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.9.0
  flutter: 3.35.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: 3.4.1
  # Phase polish — confetti burst for the listing-publish success celebration.
  confetti: ^0.8.0
  # Phase polish — fully custom pull-to-refresh (branded star indicator) over
  # any scrollable, without restructuring each feed's scroll view.
  custom_refresh_indicator: ^4.0.1
  decimal: ^3.0.0
  equatable: 2.0.8
  flutter_bloc: 9.1.1
  # Phase polish — declarative motion (entrances, shimmer, micro-interactions).
  # Pure-Dart, no platform channels; takes Duration/Curve so AppMotion stays the
  # source of truth. Reduce-motion is guarded by the app (it ignores the flag).
  flutter_animate: ^4.5.0
  flutter_lucide: 1.11.0
  flutter_secure_storage: 10.0.0
  get_it: 8.2.0
  # Phase polish — richer empty-state illustration. The animation asset
  # (assets/lottie/empty_stars.json) is authored in-repo (ours, no third-party
  # licence); recoloured to the active theme at runtime.
  lottie: ^3.1.2
  go_router: 17.2.2
  injectable: 2.5.1
  intl: 0.20.2
  supabase_flutter: 2.12.4
  image_picker: ^1.2.2
  image: ^4.8.0
  flutter_image_compress: ^2.4.0
  url_launcher: ^6.3.0
  # Phase 28 — nearby-amenities lookup (OpenStreetMap Overpass API; was already
  # transitive via supabase_flutter, promoted to a direct dep for the import).
  http: ^1.2.0
  # Phase 25 uplift v2 — native share sheet for the listing-detail Share action.
  share_plus: ^10.1.4
  # Phase 22 — push notifications (Android-only; app builds with push DISABLED
  # when google-services.json is absent — R-184/R-195/SC-003).
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.4.0
  geolocator: ^13.0.0
  permission_handler: ^11.3.0
  # Phase 24 (CR) — crash & error reporting via a self-hosted/EU Sentry instance
  # (R-206). Behind the core/ CrashReporter seam; DSN supplied via dart-define;
  # NoopCrashReporter is bound when the DSN is empty (no init, no send).
  sentry_flutter: 8.14.2
  # Phase 24 UP — in-app update prompt (Android-only; R-210).
  package_info_plus: 9.0.1
  panorama_viewer: ^2.0.7
  # Phase 29 — F4 Reels: official Flutter in-app video playback (ExoPlayer on
  # Android). One controller active at a time; strict 3-controller window.
  video_player: ^2.9.2
  # Phase 29 — F1 CRM follow-up reminders: device-local scheduled notifications.
  # There is NO server scheduler (pg_cron is not installed), so reminders are
  # scheduled on-device with zonedSchedule in INEXACT mode (no exact-alarm
  # permission). The in-app "due today" list is the permission-denied fallback.
  flutter_local_notifications: ^19.0.0
  # Phase 29 — required by flutter_local_notifications zonedSchedule (tz db +
  # device IANA zone; DateTime.timeZoneName returns unusable abbreviations).
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  # Phase 30 — F1 client-side video compression (720p) + poster thumbnails so
  # listing videos don't fill Storage (they upload RAW today). Best-effort:
  # always falls back to the original on failure.
  video_compress: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  analyzer: ^7.7.0
  bloc_test: 10.0.0
  build_runner: 2.7.1
  flutter_lints: 5.0.0
  injectable_generator: 2.8.1
  mockito: 5.5.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.7

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/watermark/
    - assets/branding/
    - assets/onboarding/
    - assets/lottie/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt_wght.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Phase 24 RB — flutter_launcher_icons config (R-212)
# Generates mipmap-* + adaptive icon into android/app/src/main/res/**
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  # Legacy (non-adaptive) icon: the white star mark on the deep-blue brand
  # background (opaque). The adaptive icon composes the transparent white mark
  # over the same brand background.
  image_path: "assets/branding/icon_legacy.png"
  # Phase 26 rebrand — the blue "N" emblem reads on a white field (the logo is
  # designed on white); the transparent emblem composes over it.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/icon.png"
  min_sdk_android: 24

# Phase 24 RB — flutter_native_splash config (R-212; light + dark)
# Phase 25 — repalette to the Claude Design brand (deep blue + dark navy).
# Generates splash drawables + values/values-night
flutter_native_splash:
  # Phase 26 rebrand — the full logo (emblem + النجوم wordmark + tagline) on
  # white in both modes; the artwork carries its own white field, so the splash
  # background is white in light and dark.
  color: "#FFFFFF"
  image: assets/branding/splash_full.png
  color_dark: "#FFFFFF"
  image_dark: assets/branding/splash_full.png
  android: true
  ios: false
  android_12:
    color: "#FFFFFF"
    image: assets/branding/icon.png
    color_dark: "#FFFFFF"
    image_dark: assets/branding/icon.png
