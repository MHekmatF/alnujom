name: alnujom
description: AlNujom Android app foundation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: 3.35.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: 3.4.1
  decimal: ^3.0.0
  equatable: 2.0.8
  flutter_bloc: 9.1.1
  flutter_lucide: 1.11.0
  flutter_secure_storage: 10.0.0
  get_it: 8.2.0
  go_router: 17.2.2
  injectable: 2.5.1
  intl: 0.20.2
  supabase_flutter: 2.12.4
  image_picker: ^1.2.2
  image: ^4.8.0
  flutter_image_compress: ^2.4.0
  url_launcher: ^6.3.0
  # Phase 22 — push notifications (Android-only; app builds with push DISABLED
  # when google-services.json is absent — R-184/R-195/SC-003).
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.4.0
  geolocator: ^13.0.0
  permission_handler: ^11.3.0
  # Phase 24 (CR) — crash & error reporting via a self-hosted/EU Sentry instance
  # (R-206). Behind the core/ CrashReporter seam; DSN supplied via dart-define;
  # NoopCrashReporter is bound when the DSN is empty (no init, no send).
  sentry_flutter: 8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  analyzer: ^7.7.0
  bloc_test: 10.0.0
  build_runner: 2.7.1
  flutter_lints: 5.0.0
  injectable_generator: 2.8.1
  mockito: 5.5.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/watermark/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt_wght.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
