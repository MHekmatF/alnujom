name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - '001-*'
      - '002-*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Lint design tokens
        run: dart run tool/lint_design_tokens.dart

      - name: Guard Supabase SDK boundary
        run: |
          if grep -rE "package:supabase_flutter" lib --include='*.dart' --exclude='supabase_client_wrapper_impl.dart'; then
            echo "Supabase SDK imports must stay inside supabase_client_wrapper_impl.dart"
            exit 1
          fi

      - name: Test
        run: flutter test

      - name: Test PropertyCard goldens
        run: flutter test test/widgets/property_card_golden_test.dart

      - name: Upload golden failure renders
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/widgets/failures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Test color contrast floor
        run: flutter test test/core/theme/color_scheme_contrast_test.dart

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=SUPABASE_URL='' --dart-define=SUPABASE_ANON_KEY=''
