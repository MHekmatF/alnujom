# CI auto-triggers PAUSED on 2026-05-22 to preserve GitHub Actions
# minutes (account-wide pool — see almaeda-system-project for the other half).
# Only manual runs allowed.
#
# To resume: uncomment the `push:` and `pull_request:` blocks below.
# Side effect: branch protection's required-status-checks gate will block
# PRs to main from merging until CI is re-enabled.

name: verify

on:
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches:
  #     - main
  #     - '001-*'
  #     - '002-*'
  #     - '003-*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Lint design tokens
        run: dart run tool/lint_design_tokens.dart

      - name: Lint l10n parity
        run: dart run tool/lint_l10n_parity.dart

      - name: Lint l10n literals
        run: dart run tool/lint_l10n_literals.dart

      - name: Guard Supabase SDK boundary (Constitution IX — no package:supabase_flutter in any domain/)
        run: |
          # Constitution IX / SC-014: Supabase types may appear in core/network wrappers
          # and feature data/ layers (Clean Architecture data sources, DTOs, repository
          # impls); they MUST NOT appear in any domain/ folder. Phase 4 originally
          # restricted Supabase to the wrapper alone, but Phase 5's auth/profile/admin
          # data sources legitimately import the SDK — only domain purity is enforced.
          matches=$(grep -rEl "package:supabase_flutter" lib --include='*.dart' | grep '/domain/' || true)
          if [ -n "$matches" ]; then
            echo "Constitution IX violation: package:supabase_flutter must NOT appear in any domain/ folder:"
            echo "$matches"
            exit 1
          fi

      - name: Test
        run: flutter test

      - name: Test PropertyCard goldens
        run: flutter test test/widgets/property_card_golden_test.dart

      - name: Upload golden failure renders
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/widgets/failures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Test color contrast floor
        run: flutter test test/core/theme/color_scheme_contrast_test.dart

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=SUPABASE_URL='' --dart-define=SUPABASE_ANON_KEY=''
